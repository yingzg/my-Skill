# local-coverage-booster 项目配置示例。
# 将配置项复制到本 Skill 目录下的 config/projects.yaml。
# 不要将此文件放入业务项目仓库。

projects:
  - name: example-service
    # 可选。精确的本地 Git 根目录。当同一台机器始终使用同一个 checkout 路径时使用。
    project_root: /path/to/example-service

    # 可选。来自 `git remote get-url origin` 的稳定子串。
    # 当不同机器使用不同 checkout 路径时优先使用此项。
    remote_url_contains: example-service

    # 用于变更 Java 行对比基准的分支/ref。
    # 使用 auto 时，本 Skill 会依次尝试 master、main、origin/master、origin/main、gitlab/master、gitlab/main，然后 HEAD~1。
    base_ref: auto

    # 真实流水线覆盖率门禁阈值。
    gate_threshold: 60

    # 本地目标应高于真实门禁，以吸收本地/远端覆盖率的差异。
    local_target_threshold: 68

    # 运行测试并生成 JaCoCo XML 报告的命令。
    coverage_command: mvn org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent test org.jacoco:jacoco-maven-plugin:0.8.12:report

    # JaCoCo XML 的路径，相对项目根目录。
    jacoco_xml: target/site/jacoco/jacoco.xml

    # 可选。省略时默认使用 coverage_command。
    test_command: mvn test

    # 可选。默认 src/main/java。
    source_root: src/main/java

    # 可选。默认 src/test/java。
    test_root: src/test/java
