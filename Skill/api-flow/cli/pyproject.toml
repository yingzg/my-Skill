[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-flow"
version = "0.1.0"
description = "API 流程测试引擎 — Agent 内部执行库"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pymysql>=1.1.0",
    "requests>=2.31.0",
    "jsonpath-rw>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api_flow"]
